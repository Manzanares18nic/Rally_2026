openapi: 3.0.3
info:
  title: Reservorio Vivo API - MVP 24 Horas (Rally LATAM 2026)
  description: |
    API REST para el **MVP de 24 horas** de **Reservorio Vivo**.
    Diseñado para ser implementado y demostrado en tiempo récord:
    - Ingesta de nivel y lluvia (físico o simulado).
    - Detección de alerta por nivel y tasa de subida rápida (+X% en Y min).
    - Detección de nodo sin señal (fallo visible).
    - Despacho de alerta por WhatsApp / SMS / Webhook.
    - Simulador integrado con 1 clic para la demo del jurado.
    - Datos públicos para el mapa y panel barrial.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor local de desarrollo

tags:
  - name: Dashboard
    description: Estado general público y mapa del reservorio
  - name: Telemetria
    description: Recepción y consulta rápida de lecturas (nodo IoT o simulador)
  - name: Alertas
    description: Estado de alertas y aprobación/envío
  - name: Simulador
    description: Control de simulación en vivo para la presentación al jurado

paths:
  # ==========================================
  # 1. DASHBOARD & ESTADO GENERAL
  # ==========================================
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Estado consolidado en tiempo real (Mapa, nivel actual, alertas)
      description: Endpoint principal que alimenta toda la pantalla inicial del frontend.
      responses:
        '200':
          description: Resumen general del sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

  # ==========================================
  # 2. TELEMETRÍA (INGESTA & HISTORIAL RÁPIDO)
  # ==========================================
  /telemetry:
    post:
      tags: [Telemetria]
      summary: Enviar lectura desde el nodo IoT (ESP32) o script de prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryInput'
      responses:
        '201':
          description: Lectura procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResult'
    get:
      tags: [Telemetria]
      summary: Obtener las últimas lecturas para la gráfica del panel
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
          description: Número de puntos recientes para la gráfica
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryPoint'

  # ==========================================
  # 3. ALERTAS
  # ==========================================
  /alerts:
    get:
      tags: [Alertas]
      summary: Listar alertas recientes (Verde, Amarillo, Rojo, Fallo Sensor)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

  /alerts/{alert_id}/send-whatsapp:
    post:
      tags: [Alertas]
      summary: Enviar o reenviar alerta a la red vecinal por WhatsApp
      parameters:
        - in: path
          name: alert_id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "WHATSAPP_SENT"
                  message:
                    type: string
                    example: "Alerta enviada exitosamente a los vigías comunitarios"

  # ==========================================
  # 4. SIMULADOR (DEMOSTRACIÓN PARA EL JURADO)
  # ==========================================
  /simulator/trigger:
    post:
      tags: [Simulador]
      summary: Disparar escenario de demostración en vivo
      description: Permite al equipo demostrar en 1 minuto cómo reacciona el sistema ante una crecida súbita o falla de sensor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: string
                  enum: [LLUVIA_TORRENCIAL, CRECIDA_SUBITA, NODO_DESCONECTADO, NORMALIZACION]
                  example: CRECIDA_SUBITA
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario_applied:
                    type: string
                  current_status:
                    type: string
                    example: "ALERTA_AMARILLA_ACTIVADA"

components:
  schemas:
    DashboardSummary:
      type: object
      properties:
        reservoir_name:
          type: string
          example: "Microrrepresa & Cauce 31 de Diciembre - Distrito VI Managua"
        location:
          type: object
          properties:
            lat:
              type: number
              example: 12.1485
            lng:
              type: number
              example: -86.2085
            neighborhood:
              type: string
              example: "Barrio 31 de Diciembre"
            district:
              type: string
              example: "Distrito VI, Managua"
        current_level_pct:
          type: number
          example: 65.0
        current_level_cm:
          type: number
          example: 195.0
        max_capacity_cm:
          type: number
          example: 300.0
        status:
          type: string
          enum: [VERDE, AMARILLO, ROJO, FALLO_SENSOR]
          example: "AMARILLO"
        rise_rate_pct_30m:
          type: number
          example: 12.5
          description: Tasa de subida porcentual en los últimos 30 minutos
        sensor_status:
          type: string
          enum: [ONLINE, SIN_SENAL]
          example: "ONLINE"
        green_modules:
          type: array
          description: Módulos de infraestructura verde periféricos (Idea B)
          items:
            type: object
            properties:
              name:
                type: string
              lat:
                type: number
              lng:
                type: number
              type:
                type: string
              retention_desc:
                type: string
        last_updated:
          type: string
          format: date-time


    TelemetryInput:
      type: object
      required: [water_level_cm]
      properties:
        water_level_cm:
          type: number
          example: 195.0
        rain_mm:
          type: number
          example: 8.5
        battery_pct:
          type: number
          example: 92.0

    TelemetryResult:
      type: object
      properties:
        status:
          type: string
          example: "SAVED"
        triggered_alert:
          type: string
          enum: [NINGUNA, AMARILLO, ROJO, SUBIDA_RAPIDA]
          example: "SUBIDA_RAPIDA"

    TelemetryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        water_level_pct:
          type: number
          example: 65.0
        water_level_cm:
          type: number
          example: 195.0
        rain_mm:
          type: number
          example: 8.5

    Alert:
      type: object
      properties:
        id:
          type: string
          example: "alt-01"
        level:
          type: string
          enum: [AMARILLO, ROJO, FALLO_SENSOR]
          example: "AMARILLO"
        title:
          type: string
          example: "Crecida rápida detectada (+12.5% en 30m)"
        instruction:
          type: string
          example: "Comité barrial: vigilar canaletas y avisar a viviendas bajas"
        created_at:
          type: string
          format: date-time
