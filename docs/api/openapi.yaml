openapi: 3.0.3
info:
  title: Reservorio Vivo API - MVP 24 Horas (Rally LATAM 2026)
  description: |
    API REST para el **MVP de 24 horas** de **Reservorio Vivo**.
    Diseñado para ser implementado y demostrado en tiempo récord:
    - Ingesta de nivel y lluvia (físico o simulado).
    - Detección de alerta por nivel y tasa de subida rápida (+X% en Y min).
    - Detección de nodo sin señal (fallo visible).
    - Despacho de alerta por WhatsApp / SMS / Webhook.
    - Simulador integrado con 1 clic para la demo del jurado.
    - Datos públicos para el mapa y panel barrial.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor local de desarrollo

tags:
  - name: Dashboard
    description: Estado general público y mapa del reservorio
  - name: Telemetria
    description: Recepción y consulta rápida de lecturas (nodo IoT o simulador)
  - name: Alertas
    description: Estado de alertas y aprobación/envío
  - name: Simulador
    description: Control de simulación en vivo para la presentación al jurado

paths:
  # ==========================================
  # 1. DASHBOARD & ESTADO GENERAL
  # ==========================================
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Estado consolidado en tiempo real (Mapa, nivel actual, alertas)
      description: Endpoint principal que alimenta toda la pantalla inicial del frontend.
      responses:
        '200':
          description: Resumen general del sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

  # ==========================================
  # 2. TELEMETRÍA (INGESTA & HISTORIAL RÁPIDO)
  # ==========================================
  /telemetry:
    post:
      tags: [Telemetria]
      summary: Enviar lectura desde el nodo IoT (ESP32) o script de prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryInput'
      responses:
        '201':
          description: Lectura procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResult'
    get:
      tags: [Telemetria]
      summary: Obtener las últimas lecturas para la gráfica del panel
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
          description: Número de puntos recientes para la gráfica
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryPoint'

  # ==========================================
  # 3. ALERTAS
  # ==========================================
  /alerts:
    get:
      tags: [Alertas]
      summary: Listar alertas recientes (Verde, Amarillo, Rojo, Fallo Sensor)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

  /alerts/{alert_id}/send-whatsapp:
    post:
      tags: [Alertas]
      summary: Enviar o reenviar alerta a la red vecinal por WhatsApp
      parameters:
        - in: path
          name: alert_id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "WHATSAPP_SENT"
                  message:
                    type: string
                    example: "Alerta enviada exitosamente a los vigías comunitarios"

  # ==========================================
  # 4. REPORTES CIUDADANOS CON VISIÓN ARTIFICIAL (IDEA E)
  # ==========================================
  /incidents:
    get:
      tags: [Reportes Ciudadanos]
      summary: Listar reportes vecinales de drenajes y cauces obstruidos
      responses:
        '200':
          description: Lista de reportes ciudadanos analizados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
    post:
      tags: [Reportes Ciudadanos]
      summary: Registrar reporte vecinal (JSON)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentInput'
      responses:
        '201':
          description: Reporte procesado y clasificado por IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /incidents/upload:
    post:
      tags: [Reportes Ciudadanos]
      summary: Subir fotografía real de drenaje para análisis por Visión Artificial
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, description, latitude, longitude]
              properties:
                image:
                  type: string
                  format: binary
                  description: Archivo de fotografía tomado por el vecino
                reporter_name:
                  type: string
                  example: "Rosa Gómez (Vecina Sabana Grande)"
                description:
                  type: string
                  example: "Sedimentos acumulados en la boca de tormenta calle 4"
                latitude:
                  type: number
                  example: 12.1255
                longitude:
                  type: number
                  example: -86.1768
      responses:
        '201':
          description: Fotografía procesada con diagnóstico de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  # ==========================================
  # 5. ADMINISTRACIÓN & DIAGNÓSTICO DE HARDWARE ESP32 (VISTA ADMIN)
  # ==========================================
  /admin/nodes:
    get:
      tags: [Administración & Nodos]
      summary: Listar todos los reservorios/nodos monitoreados en Managua
      responses:
        '200':
          description: Lista de nodos con telemetría de hardware
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeDiagnostic'

  /admin/nodes/{node_id}/select:
    post:
      tags: [Administración & Nodos]
      summary: Seleccionar el nodo activo para visualización en el mapa y simulación
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nodo seleccionado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected_node_id:
                    type: string
                  message:
                    type: string

  # ==========================================
  # 6. SIMULADOR (DEMOSTRACIÓN PARA EL JURADO)
  # ==========================================


  /simulator/trigger:
    post:
      tags: [Simulador]
      summary: Disparar escenario de demostración en vivo
      description: Permite al equipo demostrar en 1 minuto cómo reacciona el sistema ante una crecida súbita o falla de sensor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: string
                  enum: [LLUVIA_TORRENCIAL, CRECIDA_SUBITA, NODO_DESCONECTADO, NORMALIZACION]
                  example: CRECIDA_SUBITA
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario_applied:
                    type: string
                  current_status:
                    type: string
                    example: "ALERTA_AMARILLA_ACTIVADA"

components:
  schemas:
    DashboardSummary:
      type: object
      properties:
        reservoir_name:
          type: string
          example: "Cauce La Maravilla & Pista Sabana Grande - Distrito VI Managua"
        location:
          type: object
          properties:
            lat:
              type: number
              example: 12.1249
            lng:
              type: number
              example: -86.1761
            neighborhood:
              type: string
              example: "Sector Cauce La Maravilla"
            district:
              type: string
              example: "Distrito VI, Pista Sabana Grande, Managua"

        current_level_pct:
          type: number
          example: 65.0
        current_level_cm:
          type: number
          example: 195.0
        max_capacity_cm:
          type: number
          example: 300.0
        status:
          type: string
          enum: [VERDE, AMARILLO, ROJO, FALLO_SENSOR]
          example: "AMARILLO"
        rise_rate_pct_30m:
          type: number
          example: 12.5
          description: Tasa de subida porcentual en los últimos 30 minutos
        sensor_status:
          type: string
          enum: [ONLINE, SIN_SENAL]
          example: "ONLINE"
        green_modules:
          type: array
          description: Módulos de infraestructura verde periféricos (Idea B)
          items:
            type: object
            properties:
              name:
                type: string
              lat:
                type: number
              lng:
                type: number
              type:
                type: string
              retention_desc:
                type: string
        last_updated:
          type: string
          format: date-time


    TelemetryInput:
      type: object
      required: [water_level_cm]
      properties:
        water_level_cm:
          type: number
          example: 195.0
        rain_mm:
          type: number
          example: 8.5
        battery_pct:
          type: number
          example: 92.0

    TelemetryResult:
      type: object
      properties:
        status:
          type: string
          example: "SAVED"
        triggered_alert:
          type: string
          enum: [NINGUNA, AMARILLO, ROJO, SUBIDA_RAPIDA]
          example: "SUBIDA_RAPIDA"

    TelemetryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        water_level_pct:
          type: number
          example: 65.0
        water_level_cm:
          type: number
          example: 195.0
        rain_mm:
          type: number
          example: 8.5

    Alert:
      type: object
      properties:
        id:
          type: string
          example: "alt-01"
        level:
          type: string
          enum: [AMARILLO, ROJO, FALLO_SENSOR]
          example: "AMARILLO"
        title:
          type: string
          example: "Crecida rápida detectada (+12.5% en 30m)"
        instruction:
          type: string
          example: "Comité barrial: vigilar canaletas y avisar a viviendas bajas"
        created_at:
          type: string
          format: date-time

    # --- REPORTES CIUDADANOS (IDEA E) ---
    CreateIncidentInput:
      type: object
      required: [description, latitude, longitude]
      properties:
        reporter_name:
          type: string
          example: "Marcos Sandoval (Vecino Sabana Grande)"
        description:
          type: string
          example: "Sedimentos y botellas plásticas acumuladas en la boca de tormenta del puente peatonal"
        latitude:
          type: number
          example: 12.1242
        longitude:
          type: number
          example: -86.1755
        photo_url:
          type: string
          example: "https://images.unsplash.com/photo-1530587191325-3db32d826c18?auto=format&fit=crop&w=400&q=80"

    VisionAIAnalysis:
      type: object
      properties:
        obstruction_detected:
          type: boolean
          example: true
        obstruction_type:
          type: string
          example: "SEDIMENTOS_Y_RESIDUOS_PLASTICOS"
        confidence_pct:
          type: number
          example: 94.2
        urgency_level:
          type: string
          enum: [MEDIA, ALTA, CRITICA]
          example: "ALTA"
        suggested_action:
          type: string
          example: "Despachar cuadrilla de desarenado antes del pico de tormenta"

    Incident:
      type: object
      properties:
        id:
          type: string
          example: "inc-01"
        reporter_name:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photo_url:
          type: string
        status:
          type: string
          enum: [PENDIENTE, VERIFICADO_POR_IA, ATENDIDO]
          example: "VERIFICADO_POR_IA"
        ai_analysis:
          $ref: '#/components/schemas/VisionAIAnalysis'
        created_at:
          type: string
          format: date-time

    # --- ADMINISTRACIÓN DE HARDWARE & ESP32 ---
    NodeDiagnostic:
      type: object
      properties:
        id:
          type: string
          example: "node-maravilla-01"
        name:
          type: string
          example: "Cauce La Maravilla & Pista Sabana Grande"
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
            district:
              type: string
        status:
          type: string
          enum: [ONLINE, SIN_SENAL, ANOMALIA_DETECTADA]
          example: "ONLINE"
        hardware:
          type: object
          properties:
            board_type:
              type: string
              example: "ESP32-WROOM-32D (Dual Core 240MHz)"
            sensor_ultrasonic:
              type: string
              example: "JSN-SR04T Waterproof Ultrasonic"
            battery_voltage_v:
              type: number
              example: 4.12
            battery_pct:
              type: number
              example: 94.0
            solar_panel_charging:
              type: boolean
              example: true
            signal_rssi_dbm:
              type: integer
              example: -72
            signal_quality:
              type: string
              example: "EXCELENTE"
            firmware_version:
              type: string
              example: "v1.4.2-rally"
            sampling_interval_sec:
              type: integer
              example: 3
        has_anomalies:
          type: boolean
          example: false
        anomaly_description:
          type: string
          example: "Lecturas acústicas estables sin ruido parasitario"
        last_packet_time:
          type: string
          format: date-time


